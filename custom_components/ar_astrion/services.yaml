push_dashboard:
  target:
    device:
      integration: ar_astrion
  fields:
    path:
      required: false
      example: /config/astrion/lounge.json
      selector:
        text:
    config:
      required: false
      selector:
        object:

ring:
  target:
    device:
      integration: ar_astrion
  fields:
    sound:
      required: false
      default: ringtone
      selector:
        select:
          options:
            - ringtone
            - alarm
            - notification
    volume:
      required: false
      default: 80
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    duration:
      required: false
      default: 15
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: s
